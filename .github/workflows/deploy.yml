name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

# Un seul déploiement à la fois, jamais interrompu en plein milieu.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - run: rustup update stable --no-self-update && rustup default stable
      - run: cargo test --locked

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configurer SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          (umask 077; printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy)
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      # La clé est limitée côté serveur à deploy.sh : aucune commande à envoyer.
      # Sans la commande forcée, ssh ouvrirait un shell vide et sortirait en succès :
      # on exige donc la ligne de confirmation de deploy.sh.
      - name: Déployer
        shell: bash
        run: |
          ssh -T -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            root@lennyblk.dev </dev/null | tee deploy.log
          grep -q '^déployé : ' deploy.log || {
            echo "::error::deploy.sh n'a pas tourné : vérifier command= dans authorized_keys"
            exit 1
          }
